  - type: 'content-layout-block'
    textContent:
      title: "content-layout **Мик** 
      
      **_архитектура_** в _облаке_. Разрабатывайте приложения\_с\_использованием\_микросервисной ~~архитектуры~~. ^New^"
      text: 'В этом году фестиваль состоял из двух тематических треков. Материалы фестиваля размещены на платформе [Яндекс Практикум](https://practicum.yandex.ru/professions/datalens-fest-2023/subscribe/) с доступом в личный кабинет. Доступ бесплатный.'



  - type: 'extended-features-block'
    title: "extended **Мик** 
      
      **_архитектура_** в _облаке_. Разрабатывайте приложения\_с\_использованием\_микросервисной ~~архитектуры~~. ^New^"
    items:
      - title: 'Контейнеризация приложений'
        text: 'Разместите ваши микросервисы внутри изолированных контейнеров в облаке. Управляйте кластерами, создавайте задачи автоматического обновления и отката, настраивайте политики безопасности и контролируйте работу с помощью Yandex Managed Service for Kubernetes®.'
        link:
          url: '/services/managed-kubernetes'
          text: 'Узнать больше'
          theme: 'normal'
          arrow: true
      - title: 'Поддержка открытых систем'
        text: 'Используйте для создания и обслуживания проектов открытые системы и универсальные протоколы взаимодействия. Команда разработчиков Yandex Cloud и развитое сообщество пользователей платформы помогут в решении нестандартных задач и выборе оптимальных инструментов для работы с микросервисной архитектурой.'
      - title: 'Эффективность разработки'
        text: 'Разрабатывайте и выпускайте новые фичи в независимых средах распределёнными командами в соответствии с релизным циклом. Настройте автоскейлинг и масштабируйте ресурсы по требованию – вверх при увеличении нагрузки и вниз для сокращения расходов.'
        link:
          url: '/prices'
          text: 'Подробнее о тарифах'
          theme: 'normal'
          arrow: true
      - title: 'Управляемые базы данных'
        text: 'Ускорьте работу ваших приложений и повышайте отказоустойчивость с помощью управляемых кластеров баз данных. Назначьте каждому сервису базу, которая обеспечит наивысшую эффективность работы, например, Valkey™ для пользовательских сессий, а PostgreSQL для бэкенда веб-приложений. '
      - title: 'Инструменты аналитики'
        text: 'Постройте аналитическую систему и контролируйте работу приложений. Графики и дашборды с ключевыми метриками позволят вовремя выявить ошибки и выполнить отладку. Инструменты аналитики изолированы от рабочей среды и не влияют на производительность приложений.'
        link:
          url: '/services/datalens'
          text: 'Подробнее'
          theme: 'normal'
          arrow: true
      - title: 'Единая среда разработки'
        text: 'Организуйте полный цикл создания приложений внутри платформы Yandex Cloud – от разработки и тестирования до запуска в продакшн. Сервисы экосистемы поддерживают большинство языков программирования, а также современные технологии управления контейнерами и образами.'


