    overtitle: '4–15 декабря 2023'
    description: "Онлайн-фестиваль Yandex Cloud для аналитиков, руководителей и всех, кто интересуется лучшими практиками визуализации и анализа данных с помощью Yandex DataLens.



          Эксперты рассказали, как построить аналитику в облаке, организовать командную работу в BI-системе и использовать open source для своих задач.



          _Фестиваль прошёл, но вы можете ознакомиться с [материалами](https://practicum.yandex.ru/professions/datalens-fest-2023/subscribe/) бесплатно._"
