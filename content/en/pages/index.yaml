    children:
      - type: 'layout-item'
        content:
          title: 'Модернизация и масштабирование'
          text: 'Мигрируйте на СУБД Яндекса с поддержкой горизонтального масштабирования и возможностью развёртывания на произвольных аппаратных средствах. Для упрощения миграции клиентам доступны совместимость с диалектом PostgreSQL для чтения данных, набор коннекторов к внешним системам и разработка утилит для миграции партнёрами Яндекса.'
        icon: 
          position: left
          value: 'https://storage.yandexcloud.net/content-assets-bucket/ydb/thunderbolt.svg'

      - type: 'layout-item'
        content:
          title: 'Разработка бизнес-критичных систем'
          text: 'Создавайте высоконагруженные аналитические и транзакционные решения. Качество данных обеспечивается за счёт соответствия самому строгому уровню изоляции Serializable, а также сохранения строгой согласованности данных и гарантий доставки топиков exactly once.'
        icon: 
          position: left
          value: 'https://storage.yandexcloud.net/content-assets-bucket/ydb/seal-check.svg'

      - type: 'layout-item'
        content:
          title: 'Консолидация и администрирование'
          text: 'Снижайте затраты на эксплуатацию и повышайте утилизацию аппаратных ресурсов. Консолидируйте несколько инсталляций СУБД и используйте автоматические механизмы партиционирования данных, восстановления после сбоя, а также эффективные инструменты диагностики и мониторинга.'
        icon: 
          position: left
          value: 'https://storage.yandexcloud.net/content-assets-bucket/ydb/tag.svg'





